name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: js/ matches src/
        run: node tools/build-js.mjs --check
      - name: Syntax check
        run: node --check js/rules.js && node --check js/archives.js
      - name: Rules tests
        run: npm test
      - name: Artifact build
        run: npm run build:artifact

  browser:
    # The hall in a real (software-rendered) Chromium: see tests/e2e/hall.e2e.mjs.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch three.js r128
        run: |
          mkdir -p vendor
          curl -sSfL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o vendor/three.min.js
      - name: Build the single-file page
        run: npm run build:artifact
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch three.js r128 to bundle
        run: |
          mkdir -p vendor
          curl -sSfL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o vendor/three.min.js
          curl -sSfL https://raw.githubusercontent.com/mrdoob/three.js/r128/LICENSE -o vendor/three.LICENSE
      - name: Build the plugin
        run: npm run build:wp
      - name: Lint PHP
        run: find dist/librarium-archives -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Render tests
        run: |
          php tests/plugin-render.test.php render
          php tests/plugin-render.test.php sanitize
      - name: Check three.js is bundled
        run: test -s dist/librarium-archives/assets/vendor/three.min.js
      - uses: actions/upload-artifact@v4
        with:
          name: librarium-archives-plugin
          path: dist/librarium-archives.zip
