name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: node --check js/rules.js && node --check js/museum.js
      - name: Rules tests
        run: npm test
      - name: Artifact build
        run: npm run build:artifact
