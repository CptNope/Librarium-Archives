<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Walk a candlelit hall of the oldest known board games and play Senet and the Royal Game of Ur. A Librarium Games project.">
<!-- artifact:head -->
<title>Librarium Archives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almendra+SC&family=Amethysta&family=Montserrat:wght@400;600&display=swap">
<link rel="stylesheet" href="css/archives.css">
<style>html,body{height:100%;margin:0;background:#0b0907;overflow:hidden}</style>
<!-- /artifact:head -->
</head>
<body>
<!-- artifact:body -->
<div id="lm-app">
  <canvas id="lm-scene" tabindex="0" aria-label="3D archive hall. Use the timeline buttons below to visit each exhibit."></canvas>

  <div class="brand"><div class="mark">Librarium</div><div class="sub">Archives</div></div>
  <button class="iconbtn" id="lm-helpBtn" aria-label="How to explore">?</button>
  <button class="iconbtn soundbtn" id="lm-soundBtn" aria-label="Sound on. Mute" aria-pressed="true"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 8h3l4-3v10l-4-3H3z" fill="currentColor"/><path class="wave" d="M13 7.2a4 4 0 0 1 0 5.6M15.2 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path class="mute" d="M13 7.5l5 5M18 7.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button class="iconbtn fsbtn" id="lm-fsBtn" aria-label="Full screen"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 8V3h5M12 3h5v5M17 12v5h-5M8 17H3v-5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>

  <aside class="placard away" id="lm-placard" aria-live="polite">
    <button class="closeP" id="lm-closeP" aria-label="Hide placard">×</button>
    <div class="scroll" id="lm-placardBody"></div>
    <div class="actions" id="lm-placardActions"></div>
  </aside>

  <div class="hint" id="lm-hint">Drag to look · WASD or arrows to walk · [ and ] step between exhibits</div>
  <div class="joy" id="lm-joy" hidden aria-hidden="true"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12l-7 9h14zM50 88l-7-9h14zM12 50l9-7v14zM88 50l-9-7v14z" fill="currentColor"/></svg><div class="knob"></div></div>
  <nav class="rail" id="lm-rail" aria-label="Archives navigation">
    <div class="wings" id="lm-wings" role="group" aria-label="Wings"></div>
    <button class="railstep" id="lm-prev" aria-label="Previous exhibit" title="Previous exhibit ( [ )"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <div class="stops" id="lm-stops"></div>
    <button class="railstep" id="lm-next" aria-label="Next exhibit" title="Next exhibit ( ] )"><svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button class="railindex" id="lm-indexBtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="lm-index"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M3 3h5v5H3zM12 3h5v5h-5zM3 12h5v5H3zM12 12h5v5h-5z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg><span>All exhibits</span></button>
  </nav>
  <section class="index" id="lm-index" role="dialog" aria-labelledby="lm-indexTitle" hidden>
    <header class="indexhead">
      <h2 id="lm-indexTitle">All exhibits</h2>
      <span class="indexcount" id="lm-indexCount"></span>
      <input type="search" id="lm-indexSearch" placeholder="Find a game, a place, a date" aria-label="Find an exhibit" autocomplete="off">
      <div class="chips" id="lm-indexChips" role="group" aria-label="Show">
        <button data-f="all" aria-pressed="true">All</button><button data-f="play" aria-pressed="false">Playable</button><button data-f="new" aria-pressed="false">Not visited</button>
      </div>
      <button class="indexclose" id="lm-indexClose" aria-label="Close the index">×</button>
    </header>
    <div class="indexcols" id="lm-indexCols"></div>
    <p class="indexnone" id="lm-indexNone" hidden>Nothing matches. Try another word.</p>
  </section>

  <section class="hud" id="lm-hud" hidden>
    <div class="hudtop">
      <div class="hudtitle" id="lm-hudTitle"></div>
      <div class="score" id="lm-score"></div>
      <div class="level" id="lm-level" role="group" aria-label="How hard the Scribe plays">
        <span>Scribe</span>
        <button data-level="gentle" aria-pressed="false">Gentle</button>
        <button data-level="fair" aria-pressed="true">Fair</button>
        <button data-level="sharp" aria-pressed="false">Sharp</button>
      </div>
      <div class="level" id="lm-variant" role="group" aria-label="Game variant" hidden></div>
      <button class="hudbtn" id="lm-rulesBtn">Rules</button>
      <button class="hudbtn" id="lm-leaveBtn">Leave the table</button>
    </div>
    <div class="rules" id="lm-rules" hidden></div>
    <div class="hudbottom">
      <div class="dice" id="lm-dice" aria-hidden="true"></div>
      <div class="msg" id="lm-msg" aria-live="polite"></div>
      <div class="choices" id="lm-choices" role="group" aria-label="Choices" hidden></div>
      <button class="btn primary" id="lm-throwBtn">Throw</button>
      <button class="btn" id="lm-passBtn" hidden>Pass</button>
    </div>
    <div class="win" id="lm-win" hidden>
      <div class="card">
        <h3 id="lm-winTitle"></h3>
        <p id="lm-winText"></p>
        <p class="winrec" id="lm-winRecord"></p>
        <div class="row">
          <button class="btn primary" id="lm-againBtn">Play again</button>
          <button class="btn" id="lm-winLeave">Back to the hall</button>
        </div>
      </div>
    </div>
  </section>

  <div class="loader" id="lm-loader"><div>Lighting the lamps…<small>Librarium Archives</small></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/rules.js"></script>
<script src="js/archives.js"></script>
<!-- /artifact:body -->
</body>
</html>
